<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 512px;
      height: 512px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Cinzel:wght@600;700&amp;display=swap');
      
      .circular-text {
        font-family: 'Cormorant Garamond', 'Cinzel', 'Times New Roman', serif;
        font-size: 36px;
        font-weight: 700;
        fill: #4A2C20;
        letter-spacing: 0.12em;
      }
      
      .stroke-main {
        stroke: #4A2C20;
        fill: none;
        stroke-width: 3.6px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
      .stroke-bold {
        stroke: #4A2C20;
        fill: none;
        stroke-width: 4.2px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
      .stroke-medium {
        stroke: #4A2C20;
        fill: none;
        stroke-width: 2.8px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
      .stroke-thin {
        stroke: #4A2C20;
        fill: none;
        stroke-width: 2.0px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
      .fill-dark {
        fill: #4A2C20;
      }
    </style>
    
    <!-- Path 1: INSTITUTE (upper-left arc from ~8:30 to ~11:45) -->
    <!-- Center (256,256), r=188. Angle from 215 deg to 95 deg -->
    <path id="pathInstitute" d="M 123,388 A 188,188 0 0,1 240,68" fill="none" />
    
    <!-- Path 2: GLOBAL (upper-right arc from ~12:15 to ~3:30) -->
    <!-- Angle from 80 deg to -20 deg (or 270 to 340) -->
    <path id="pathGlobal" d="M 272,68 A 188,188 0 0,1 440,290" fill="none" />
    
    <!-- Path 3: NAGAS (bottom arc from ~4:15 to ~7:45) -->
    <!-- Angle from 335 deg around bottom to 225 deg -->
    <path id="pathNagas" d="M 416,340 A 188,188 0 0,1 154,395" fill="none" />
  </defs>

  <!-- Circular Text with CORRECT spelling: INSTITUTE (not Institude) -->
  <text class="circular-text">
    <textPath href="#pathInstitute" startOffset="50%" text-anchor="middle">INSTITUTE</textPath>
  </text>
  <text class="circular-text">
    <textPath href="#pathGlobal" startOffset="50%" text-anchor="middle">GLOBAL</textPath>
  </text>
  <text class="circular-text">
    <textPath href="#pathNagas" startOffset="50%" text-anchor="middle">NAGAS</textPath>
  </text>

  <!-- CENTER MONOGRAM (SOLID, CRISP, CLEAN CONTINUOUS OUTLINES) -->
  <g id="center-monogram">
    
    <!-- === LETTER 'I' (Left Serif Pillar) === -->
    <!-- Top Serif Bracket & Bar -->
    <path class="stroke-main" d="M 186,158 L 244,158" />
    <path class="stroke-thin" d="M 186,154 L 244,154" />
    <path class="stroke-thin" d="M 186,154 L 186,161" />
    <path class="stroke-thin" d="M 244,154 L 244,161" />
    <path class="stroke-thin" d="M 186,161 C 196,161 206,166 208,174" />
    <path class="stroke-thin" d="M 244,161 C 234,161 224,166 222,174" />
    
    <!-- Left & Right Vertical Columns of 'I' (Hollow Architectural Column) -->
    <path class="stroke-bold" d="M 208,168 L 208,344" />
    <path class="stroke-bold" d="M 222,168 L 222,344" />
    
    <!-- Bottom Serif Bracket & Bar -->
    <path class="stroke-thin" d="M 208,338 C 206,346 196,351 186,351" />
    <path class="stroke-thin" d="M 222,338 C 224,346 234,351 244,351" />
    <path class="stroke-main" d="M 186,354 L 244,354" />
    <path class="stroke-thin" d="M 186,358 L 244,358" />
    <path class="stroke-thin" d="M 186,351 L 186,358" />
    <path class="stroke-thin" d="M 244,351 L 244,358" />

    <!-- === LETTER 'G' (Outer & Inner Structural Curves) === -->
    <!-- Top Arc of G starting from right of I -->
    <path class="stroke-bold" d="M 222,222 C 228,188 258,180 286,180 C 318,180 340,202 340,236 C 340,264 326,282 306,282" />
    
    <!-- G Crossbar / Shelf -->
    <path class="stroke-main" d="M 306,282 L 274,282" />
    <path class="stroke-main" d="M 274,282 L 274,298" />
    
    <!-- G Lower Swoop -->
    <path class="stroke-bold" d="M 274,298 C 294,302 340,314 340,338 C 340,358 308,362 280,362 C 248,362 226,350 222,342" />

    <!-- === LETTER 'N' (Intertwined Monogram in Lower Section) === -->
    <!-- Left vertical stem of N -->
    <path class="stroke-main" d="M 242,284 L 242,348" />
    
    <!-- Diagonal of N with ladder rungs -->
    <path class="stroke-bold" d="M 242,284 L 274,348" />
    <path class="stroke-thin" d="M 247,295 L 254,300" />
    <path class="stroke-thin" d="M 252,307 L 259,312" />
    <path class="stroke-thin" d="M 258,319 L 265,324" />
    <path class="stroke-thin" d="M 264,331 L 271,336" />
    
    <!-- Right vertical stem of N -->
    <path class="stroke-main" d="M 274,282 L 274,348" />
    
    <!-- Top & Bottom Serifs for N -->
    <path class="stroke-thin" d="M 236,284 L 248,284" />
    <path class="stroke-thin" d="M 268,348 L 280,348" />

    <!-- === CENTRAL EMBLEM (Sun/Lamp of Wisdom & Open Book) === -->
    <!-- Radiating Sun / Lamp of Wisdom -->
    <circle cx="282" cy="224" r="11" class="stroke-main" />
    <circle cx="282" cy="224" r="4.5" class="fill-dark" />
    <!-- Rays -->
    <path class="stroke-thin" d="M 282,206 L 282,211" />
    <path class="stroke-thin" d="M 282,237 L 282,242" />
    <path class="stroke-thin" d="M 264,224 L 269,224" />
    <path class="stroke-thin" d="M 295,224 L 300,224" />
    <path class="stroke-thin" d="M 269,211 L 273,215" />
    <path class="stroke-thin" d="M 295,237 L 291,233" />
    <path class="stroke-thin" d="M 269,237 L 273,233" />
    <path class="stroke-thin" d="M 295,211 L 291,215" />

    <!-- Open Book / Palm Leaf Manuscript -->
    <!-- Left Page -->
    <path class="stroke-main" d="M 282,246 C 272,242 258,242 250,245 C 250,258 272,257 282,260 Z" />
    <path class="stroke-thin" d="M 255,250 C 263,247 274,247 280,251" />
    
    <!-- Right Page -->
    <path class="stroke-main" d="M 282,246 C 292,242 306,242 314,245 C 314,258 292,257 282,260 Z" />
    <path class="stroke-thin" d="M 309,250 C 301,247 290,247 284,251" />
    
    <!-- Central Torch / Axis -->
    <path class="stroke-main" d="M 282,242 L 282,282" />
    
  </g>
</svg>
</body>
</html>
